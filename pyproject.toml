[tool.poetry]
name = "lucienshui"
version = "0.1.0"
description = "A sample Python project for demonstrating Poetry dependency management"
authors = ["copilot-swe-agent[bot] <198982749+Copilot@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.25.0"
numpy = ">=1.24.0,<3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0,<9.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
